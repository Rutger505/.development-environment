# Application bindings
$browser = omarchy-launch-browser

bindd = SUPER, RETURN, Terminal, exec, uwsm app -- xdg-terminal-exec --working-directory="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm app -- nautilus --new-window
bindd = SUPER SHIFT, B, Browser, exec, $browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, $browser --private
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, T, Activity, exec, omarchy-launch-tui btop
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus signal "uwsm app -- signal-desktop"
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus obsidian "uwsm-app -- obsidian"
bindd = SUPER SHIFT, slash, Passwords, exec, uwsm app -- 1password

# If your web app url contains #, type it as ## to prevent hyperland treat it as comments
bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-webapp "https://app.hey.com/calendar/weeks/"
bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER SHIFT, SPACE
# bindd = SUPER SHIFT, SPACE, Omarchy menu, exec, omarchy-menu

######### CUSTOM #########
bindd = SUPER, N, Network manager, exec, omarchy-launch-wifi
bindd = SUPER, A, Audio settings, exec, omarchy-launch-or-focus-tui wiremix --tab output
bindd = SUPER, B, Bluetooth settings, exec, omarchy-launch-or-focus-tui bluetui

bindd = SUPER, D, Display settings, exec, uwsm app -- nwg-displays
windowrule = tag +floating-window, match:class nwg-displays

bind = SUPER, U, exec, xdg-terminal-exec --app-id=com.rutger505.SystemUpdate -e "dev-env-update-system"
windowrule = workspace special:scratchpad, match:class com.rutger505.SystemUpdate

# Move/Resize focused window
binddm = SUPER, Z, Hold to move window, movewindow
binddm = SUPER, X, Hold to resize window, resizewindow

bindde = SUPER CONTROL, RIGHT, Resize window right , resizeactive, 30 0
bindde = SUPER CONTROL, LEFT, Resize window left, resizeactive, -30 0
bindde = SUPER CONTROL, UP, Resize window up, resizeactive, 0 -30
bindde = SUPER CONTROL, DOWN, Resize  window down, resizeactive, 0 30

# GPU Screen Recorder
# gsr's own evdev hotkeys are disabled (main.hotkeys_enable_option disable_hotkeys)
# because kanata grabs the physical keyboards and gsr skips kanata's virtual
# device as "might be a mouse", so it can never grab anything. See
# applications/packages/kanata.sh.
bindd = ALT, Z, GSR show/hide, exec, gsr-ui-cli toggle-show
bindd = ALT, F7, GSR pause/unpause recording, exec, gsr-ui-cli toggle-pause
bindd = ALT, F8, GSR start/stop streaming, exec, gsr-ui-cli toggle-stream
bindd = ALT, F9, GSR start/stop recording, exec, gsr-ui-cli toggle-record
bindd = ALT CONTROL, F9, GSR record window, exec, gsr-ui-cli toggle-record-window
bindd = ALT SHIFT, F9, GSR record region, exec, gsr-ui-cli toggle-record-region
bindd = ALT CONTROL, F10, GSR start/stop replay, exec, gsr-ui-cli toggle-replay
bindd = ALT, F10, GSR save replay, exec, gsr-ui-cli replay-save
bindd = ALT, F11, GSR save replay (1 min), exec, gsr-ui-cli replay-save-1-min
bindd = ALT, F12, GSR save replay (10 min), exec, gsr-ui-cli replay-save-10-min
bindd = , PRINT, GSR screenshot, exec, gsr-ui-cli take-screenshot
bindd = ALT CONTROL, PRINT, GSR screenshot window, exec, gsr-ui-cli take-screenshot-window
bindd = ALT SHIFT, PRINT, GSR screenshot region, exec, gsr-ui-cli take-screenshot-region
